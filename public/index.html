<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Event Bus Demo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h2>Event Bus Demo</h2>
  <p>Click on SVG files to trigger events (watch the terminal for event flow)</p>
  
  <div class="container">
    <div class="panel">
      <h3>SVG Files</h3>
      <div id="svg-list"></div>
    </div>
    
    <div class="panel">
      <h3>Quadrants</h3>
      <div id="quadrants">
        <div class="quadrant" data-id="1">Quadrant 1</div>
        <div class="quadrant" data-id="2">Quadrant 2</div>
        <div class="quadrant" data-id="3">Quadrant 3</div>
        <div class="quadrant" data-id="4">Quadrant 4</div>
      </div>
    </div>
  </div>
  
  <div class="container">
    <div class="panel">
      <h3>Error Testing</h3>
      <p>Click the button to simulate an event handler error</p>
      <button id="trigger-error">Trigger Error</button>
      <div id="error-log" class="log error-log"></div>
    </div>
  </div>
  
  <script type="module">
    import { initApp } from './js/client.js';
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
